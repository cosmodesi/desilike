name: Bug Report
description: File a bug report.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Please describe the problem you encountered with ``desilike``.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: What version of ``desilike`` shows this problem?
      placeholder: DESI environment on NERSC, commit e49a02f etc.
