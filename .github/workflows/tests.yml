# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: tests

on:
  push:
    paths: ['.github/workflows/**', 'desilike/**', 'pyproject.toml']
  pull_request:
    paths: ['.github/workflows/**', 'desilike/**', 'pyproject.toml']
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:

env:
  # The version whose coverage is reported -- and the only one that runs desilike/theories, which
  # is ~94% of the suite's runtime.  Those tests exercise numerics, not Python-version behaviour,
  # so running them on all four versions cost four times the minutes for one version's worth of
  # signal.  The trade is explicit: a theory-level break that is specific to another interpreter
  # is caught by the monthly cron on that version, not by the push that introduces it.
  COVERAGE_PYTHON: "3.13"
  # Packages holding MPI-aware code (`mpicomm` / `mpi4py`): samplers, profilers, samples,
  # emulators, and the package root (desilike/tests covers it).  Nothing else can behave
  # differently off rank 0, so nothing else is worth running twice under mpirun.
  MPI_TESTPATHS: "desilike/tests desilike/samplers desilike/profilers desilike/samples desilike/emulators"

jobs:
  test:

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # 3.10 is out: jax stopped at 0.6.2 there, too old for desilike's jax-native design.
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        # The serial and MPI passes are independent -- they only used to run one after the other
        # because they shared a `coverage combine`.  As two matrix legs they run concurrently, so
        # the check's wall clock is the slower of the two rather than their sum.
        suite: [serial, mpi]
        include:
          # desilike/theories is ~94% of the runtime and runs on one version only, so rather than
          # sit in `serial` it gets legs of its own -- and separate legs mean separate runners.
          # That matters for memory, not just speed: a process's footprint grows monotonically
          # through a run as emulator state accumulates (measured 6.7 GB over
          # test_full_shape_emulated.py, 13.4 GB over the larger test_full_shape.py), so the
          # ceiling scales with how many theory tests one process has got through.  Splitting the
          # work across runners lowers it; `pytest -n`, which was tried here, raises it -- two
          # workers on one runner reached 23.7 GB against the 16 GB a runner has, and the leg died
          # with the agent killed under it.  Each of these legs runs a subset of the suite that was
          # green single-process before any of this, so none can need more than that already did.
          - {os: ubuntu-latest, python-version: "3.13", suite: theories-full-shape}
          - {os: ubuntu-latest, python-version: "3.13", suite: theories-emulated}
          - {os: ubuntu-latest, python-version: "3.13", suite: theories-rest}
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.suite }} (${{ matrix.os }}, ${{ matrix.python-version }})

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Cache pip wheels
      uses: actions/cache@v4
      with:
        path: |
          wheelhouse
          ${{ runner.os == 'Linux' && '~/.cache/pip' || '~/Library/Caches/pip' }}
        key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('**/pyproject.toml') }}
        restore-keys: ${{ runner.os }}-pip-${{ matrix.python-version }}-
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install 'ruff>=0.16,<0.17' pytest pytest-cov pytest-mpi pytest-timeout
        if [ "$RUNNER_OS" == "Linux" ]; then
          sudo apt install libopenmpi-dev
        else
          brew install openmpi
          brew install libomp
        fi
        python -m pip install torch --index-url https://download.pytorch.org/whl/cpu  # prevent pocoMC from pulling CUDA libraries
        # TODO: Explicitly caching pyclass shouldn't be necessary once it's on PyPI.
        # Only pyclass: it compiles CLASS, which is what the cache is worth paying for.  A
        # cached wheel is never rebuilt (the cache restore-key matches across pyproject.toml
        # changes), so anything cached here is pinned to the commit it was first built from --
        # cosmoprimo was, and `.[tests]` then found the stale version already satisfied.
        mkdir -p wheelhouse
        if ! ls wheelhouse/pyclass-*.whl > /dev/null 2>&1; then
            pip wheel -w wheelhouse git+https://github.com/adematti/pyclass
        fi
        python -m pip install --no-index --find-links=wheelhouse pyclass
        python -m pip install .[tests]  # brings in cosmoprimo and lsstypes, from git, every run
        python -m pip install ipython  # TODO: temporary fix for https://github.com/AnswerDotAI/fastprogress/issues/117
    - name: Lint with ruff
      if: matrix.suite == 'serial'  # the same tree either way; linting it twice says nothing new
      run: |
        # Rules and per-file exceptions live in pyproject.toml, [tool.ruff.lint].
        ruff check desilike
    - name: Test with pytest
      # Outer net for a hang that pytest-timeout cannot see because it happens outside a test
      # item: collection, MPI_Finalize, or interpreter shutdown.  It only has to beat the 6h
      # default that once let a deadlocked mpirun burn a whole job.
      timeout-minutes: 90
      run: |
        # Tests live next to the code they cover; `testpaths` in pyproject.toml points at them.
        #
        # --timeout turns a deadlock into a named failure with a stack trace instead of a
        # cancelled job.  --timeout-method=thread is required, not a preference: the default
        # `signal` method cannot interrupt a rank blocked inside MPI_Recv -- measured, the
        # blocked rank sat there until the job was killed -- whereas a watchdog thread dumps
        # the stack and names the line.  Both limits are ~10x the slowest test they cover, so
        # only a genuine hang can trip them.
        TIMEOUT_METHOD="--timeout-method=thread"
        SHAPE=desilike/theories/tests/test_full_shape.py
        EMULATED=desilike/theories/tests/test_full_shape_emulated.py
        # Every leg runs one process.  `pytest -n` is deliberately absent: the runner has 2 cores,
        # so it was worth 2x at best, and it doubled a footprint that already grows through a run
        # -- see the note on the theories legs above.  Parallelism comes from the legs instead.
        # The slowest legitimate test is ~4 min, so --timeout=1800 is pure headroom.
        case "${{ matrix.suite }}" in
          mpi)
            # The slowest test in this subset is ~30s, hence the tighter limit.
            mpirun -n 2 bash -c "COVERAGE_FILE=.coverage.mpi.\$OMPI_COMM_WORLD_RANK python -m pytest --cov=desilike --durations=0 --with-mpi $MPI_TESTPATHS --timeout=600 $TIMEOUT_METHOD"
            ;;
          theories-full-shape) TARGET="$SHAPE" ;;
          theories-emulated)   TARGET="$EMULATED" ;;
          theories-rest)       TARGET="desilike/theories --ignore=$SHAPE --ignore=$EMULATED" ;;
          serial)              TARGET="--ignore=desilike/theories" ;;
        esac
        if [ "${{ matrix.suite }}" != "mpi" ]; then
          COVERAGE_FILE=.coverage.${{ matrix.suite }} python -m pytest --cov=desilike --durations=0 \
            $TARGET --timeout=1800 $TIMEOUT_METHOD
        fi
    - name: Upload coverage data
      # Only the reported version's data is kept; the other legs run a subset and would dilute it.
      if: ${{ success() && ( matrix.python-version == env.COVERAGE_PYTHON ) && ( matrix.os == 'ubuntu-latest' ) }}
      uses: actions/upload-artifact@v4
      with:
        name: coverage-${{ matrix.suite }}
        path: .coverage.*
        include-hidden-files: true  # `.coverage.*` is dotted, and v4 drops hidden files by default
        if-no-files-found: error

  coverage:
    # The combine step the split took out of the test job: it needs both passes' data, so it can
    # only run once both have finished.
    needs: test
    if: success()
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ env.COVERAGE_PYTHON }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.COVERAGE_PYTHON }}
    - name: Download coverage data
      uses: actions/download-artifact@v4
      with:
        pattern: coverage-*
        merge-multiple: true
    - name: Combine
      run: |
        python -m pip install coverage
        coverage combine
        coverage lcov
    - name: Coverage with Coveralls
      uses: coverallsapp/github-action@v2
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        path-to-lcov: coverage.lcov
