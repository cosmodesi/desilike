class: PyBirdTracerPowerSpectrumMultipoles

params:
  b1:
    prior:
      limits: [0., 10.]
    ref:
      limits: [1.4, 1.6]
    latex: b_{1}
  b2:
    prior:
      limits: [-15., 15.]
    ref:
      limits: [-1., 1.]
    latex: b_{2}
  b3:
    prior:
      dist: norm
      loc: 0.
      scale: 10.
    ref:
      dist: norm
      loc: 0.
      scale: 0.5
    latex: b_{3}
  b4:
    prior:
      limits: [-15., 15.]
    ref:
      limits: [-1., 1.]
    latex: b_{4}
  cct:
    ref:
      dist: norm
      loc: 0.
      scale: 1.
    latex: c_{t}
  cr1:
    prior:
    ref:
      dist: norm
      loc: 0.
      scale: 1.
    latex: c_{r, 1}
  cr2:
    prior:
    ref:
      dist: norm
      loc: 0.
      scale: 1.
    latex: c_{r, 2}
  cr4:
    prior:
    ref:
      dist: norm
      loc: 0.
      scale: 1.
    latex: c_{r, 4}
  cr6:
    prior:
    ref:
      dist: norm
      loc: 0.
      scale: 1.
    latex: c_{r, 6}
  ce0:
    prior:
    ref:
      dist: norm
      loc: 0.
      scale: 1.
    latex: c_{e, 0}
  ce1:
    fixed: True
    prior:
    ref:
      dist: norm
      loc: 0.
      scale: 1.
    latex: c_{e, 1}
  ce2:
    prior:
    ref:
      dist: norm
      loc: 0.
      scale: 1.
    latex: c_{e, 2}
  # velocileptors
  bs:
    prior:
      dist: norm
      loc: 0.
      scale: 10.
    ref:
      dist: norm
      loc: 0.
      scale: 0.5
    latex: b_{s}
  # west coast
  b2p4:
    prior:
      limits: [-15., 15.]
    ref:
      limits: [-1., 1.]
    latex: '(b_{2} + b_{4})/\sqrt{2}'
  b2m4:
    fixed: True
    prior:
      limits: [-15., 15.]
    ref:
      limits: [-1., 1.]
    latex: '(b_{2} - b_{4})/\sqrt{2}'
  # east coast
  b2t:
    prior:
      limits: [-15., 15.]
    ref:
      limits: [-1., 1.]
    latex: 'b_{2t}'
  b2g:
    prior:
      limits: [-15., 15.]
    ref:
      limits: [-1., 1.]
    latex: 'b_{2g}'
  b3g:
    prior:
      limits: [-15., 15.]
    ref:
      limits: [-1., 1.]
    latex: 'b_{2g}'
  c[:5:2]:
    prior:
    ref:
      dist: norm
      loc: 0.
      scale: 100.
    latex: c_{[]}
  ct:
    prior:
    ref:
      dist: norm
      loc: 0.
      scale: 100.
    latex: c_{t}
