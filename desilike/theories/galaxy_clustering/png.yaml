class: PNGTracerPowerSpectrumMultipoles

params:
  fnl_loc:
    prior:
      limits: [-300., 300.]
    ref:
      limits: [-10., 10.]
    delta: 1.
    latex: f_{\mathrm{NL}}^{\mathrm{loc}}
  # SY-EXCESS, NOT the full tauNL: tnl_exc_loc = tauNL_loc - (6/5 fnl_loc)^2.
  #   (relation to the (5/6)^2 convention: tnl_exc_loc = (36/25) * rNL, rNL = (25/36)tauNL - fNL^2.)
  # tnl_exc_loc >= 0 IS the Suyama-Yamaguchi bound. Default fixed=0 -> single-field/SY-saturated,
  # which leaves the standard Delta_b^2 in the Kaiser term untouched. The true local trispectrum
  # amplitude is tauNL_loc = tnl_exc_loc + (6/5 fnl_loc)^2 (compute as a derived parameter).
  tnl_exc_loc:
    value: 0.
    fixed: True
    prior:
      limits: [-1e6, 1e6]
    ref:
      limits: [-1000., 1000.]
    delta: 100.
    latex: \Delta\tau_{\mathrm{NL}}^{\mathrm{loc}}
  bphi:
    prior:
      limits: [-10, 10]
    ref:
      limits: [3., 4.]
    delta: 0.1
    latex: b_{\phi}
  p:
    value: 1.
    prior:
      limits: [0, 3]
    ref:
      limits: [0.5, 1.5]
    delta: 0.1
    latex: p
  bfnl_loc:
    value: 0.
    prior:
      limits: [-1e3, 1e3]
    ref:
      limits: [-50., 50.]
    delta: 1.
    latex: b_{\phi}f_{\mathrm{NL}}^{\mathrm{loc}}
  b1:
    value: 2.
    prior:
      limits: [0.1, 10]
    ref:
      limits: [1.5, 2.5]
    delta: 0.1
    latex: b_{1}
  sn0:
    prior:
      dist: norm
      loc: 0.
      scale: 1000.
    ref:
      dist: norm
      loc: 0.
      scale: 0.1
    delta: 0.05
    latex: s_{n, 0}
  sigmas:
    value: 0.
    prior:
      limits: [0., 10]
    ref:
      limits: [1., 4.]
    delta: 0.2
    latex: \Sigma_{s}

