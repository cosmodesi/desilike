[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "desilike"
authors = [
    {name = "cosmodesi"},
    {name = "Arnaud De Mattia"},
    {name = "Johannes U. Lange", email = "jlange@american.edu"}]
readme = "README.md"
license = {file = "LICENSE"}
classifiers = ["License :: OSI Approved :: BSD License"]
dynamic = ["version", "description"]
requires-python = ">= 3.11"
dependencies = [
    "numpy>=1.18.0",
    "scipy",
    "pyyaml",
    "mpi4py",
    "jax",
    "interpax",
    "cosmoprimo @ git+https://github.com/cosmodesi/cosmoprimo",
    "lsstypes @ git+https://github.com/adematti/lsstypes"]

[project.optional-dependencies]
tests = [
    "matplotlib",
    "emcee",
    "pyclass @ git+https://github.com/adematti/pyclass",
    "folps @ git+https://github.com/cosmodesi/FolpsD",
    "velocileptors @ git+https://github.com/sfschen/velocileptors.git",
    "pybird-lss @ git+https://github.com/pierrexyz/pybird.git",
    "camb",
    "fitsio",
    "dynesty",
    "nautilus-sampler",
    "pocomc",
    "zeus-mcmc",
    "h5py",
    "jax",
    "interpax",
    "blackjax"]
plotting = [
    "matplotlib",
    "tabulate",
    "getdist",
    "anesthetic"]

[project.urls]
Home = "https://desilike.readthedocs.io/en/latest/"

[tool.pytest.ini_options]
testpaths = ["desilike"]
# The `download` tests fetch hundreds of MB of released data over the network, so they are
# deselected by default; run them with `pytest -m download`.
markers = ["download: needs network, and downloads hundreds of MB of released data"]
addopts = "-m 'not download'"

[tool.flit]
sdist.exclude = ["doc", ".gitignore", ".github", ".readthedocs.yaml"]
module.name = "desilike"

[tool.ruff.lint]
select = ["B", "C4", "E4", "E7", "E9", "F", "FURB", "PERF", "PIE", "PL", "RET", "RUF", "SIM", "UP"]
ignore = [
    # Long-standing style of this code base.
    "E401",     # multiple-imports-on-one-line
    "E402",     # module-import-not-at-top-of-file
    "E701",     # multiple-statements-on-one-line-colon
    "E702",     # multiple-statements-on-one-line-semicolon
    "E711",     # none-comparison
    "E713",     # not-in-test
    "E714",     # not-is-test
    "E721",     # type-comparison
    "E722",     # bare-except
    "E731",     # lambda-assignment
    "E741",     # ambiguous-variable-name
    "F401",     # unused-import
    "F403",     # undefined-local-with-import-star
    "F405",     # undefined-local-with-import-star-usage
    "F523",     # string-dot-format-extra-positional-arguments
    "F524",     # string-dot-format-missing-arguments
    "F541",     # f-string-missing-placeholders
    "F601",     # literal-membership
    "F811",     # redefined-while-unused
    "F841",     # unused-variable
    "C408",     # unnecessary-collection-call: dict(a=1) is used throughout
    "RUF005",   # collection-literal-concatenation
    "RUF012",   # mutable-class-default: would require ClassVar annotations everywhere
    "PLW2901",  # redefined-loop-name
    "PLW0108",  # unnecessary-lambda
    "PLW0603",  # global-statement
    "PLW1641",  # eq-without-hash: these classes are deliberately unhashable
    "B007",     # unused-loop-control-variable
    "B028",     # no-explicit-stacklevel
    "B905",     # zip-without-explicit-strict
    "SIM105",   # suppressible-exception
    "SIM108",   # if-else-block-instead-of-if-exp
    "SIM115",   # open-file-with-context-handler: file handles are held on purpose
    "RET504",   # unnecessary-assign
    "RET505",   # superfluous-else-return
    "RET506",   # superfluous-else-raise
    "RET508",   # superfluous-else-break
    "PERF203",  # try-except-in-loop
    "RUF100",   # unused-noqa: the `# noqa` markers in the code document intent, even for ignored rules
    # Physics notation in docstrings and comments (Greek letters, minus signs...).
    "RUF001",   # ambiguous-unicode-character-string
    "RUF002",   # ambiguous-unicode-character-docstring
    "RUF003",   # ambiguous-unicode-character-comment
    # Imports are deferred on purpose, to keep optional dependencies optional.
    "PLC0415",  # import-outside-top-level
    # Complexity metrics, not actionable here.
    "PLR0911",  # too-many-return-statements
    "PLR0912",  # too-many-branches
    "PLR0913",  # too-many-arguments
    "PLR0915",  # too-many-statements
    "PLR0917",  # too-many-positional-arguments
    "PLR2004",  # magic-value-comparison
]

[tool.ruff.lint.per-file-ignores]
# LaTeX is built with %-formatting: f-strings would have to double every brace.
"desilike/parameter.py" = ["UP031"]
# Benchmark scripts: the closures built in a loop are all consumed in the same iteration.
"desilike/samplers/tests/benchmark.py" = ["B023"]
"desilike/tests/benchmark_galaxy_clustering.py" = ["B023"]
